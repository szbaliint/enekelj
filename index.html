<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16101f">
  <meta name="description" content="Énekelj! – társasjáték: kapsz egy random szót, és el kell énekelned egy dalt, amiben benne van. Sing It! – a party game: get a random word, sing a song with it.">
  <title>Énekelj!</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">

    <!-- BEÁLLÍTÁSOK / SETUP -->
    <section id="screen-setup" class="screen active" aria-labelledby="title">
      <header class="hero">
        <div class="lang seg" role="radiogroup" data-setting="lang" aria-label="Nyelv / Language">
          <button type="button" role="radio" data-value="hu">🇭🇺 HU</button>
          <button type="button" role="radio" data-value="en">🇬🇧 EN</button>
        </div>
        <h1 id="title"><span data-i18n="appName"></span><span class="accent">!</span></h1>
        <p class="tagline" data-i18n="tagline"></p>
      </header>

      <div class="panel">
        <h2 data-i18n="players"></h2>
        <form id="player-form" class="row" autocomplete="off">
          <input id="player-input" type="text" maxlength="20">
          <button type="submit" class="btn btn-ghost" data-i18n="add"></button>
        </form>
        <ul id="player-list" class="chips" aria-live="polite"></ul>
        <p class="hint" id="player-hint" data-i18n="playerHint"></p>
      </div>

      <div class="panel">
        <h2 data-i18n="game"></h2>
        <div class="seg" role="radiogroup" data-setting="game">
          <button type="button" role="radio" data-value="szo" data-i18n="games.szo"></button>
          <button type="button" role="radio" data-value="dal" data-i18n="games.dal"></button>
        </div>
        <p class="hint" id="game-desc"></p>

        <h2 data-i18n="mode"></h2>
        <div class="seg" role="radiogroup" data-setting="mode">
          <button type="button" role="radio" data-value="kor" data-i18n="modes.kor"></button>
          <button type="button" role="radio" data-value="gyors" data-i18n="modes.gyors"></button>
        </div>
        <p class="hint" id="mode-desc"></p>

        <div id="goal-row" hidden>
          <h2 data-i18n="goal"></h2>
          <div class="seg" role="radiogroup" data-setting="goal">
            <button type="button" role="radio" data-value="3">3</button>
            <button type="button" role="radio" data-value="5">5</button>
            <button type="button" role="radio" data-value="10">10</button>
          </div>
        </div>

        <h2 data-i18n="difficulty"></h2>
        <div class="seg" role="radiogroup" data-setting="difficulty">
          <button type="button" role="radio" data-value="konnyu" data-i18n="levels.konnyu"></button>
          <button type="button" role="radio" data-value="kozepes" data-i18n="levels.kozepes"></button>
          <button type="button" role="radio" data-value="nehez" data-i18n="levels.nehez"></button>
          <button type="button" role="radio" data-value="vegyes" data-i18n="levels.vegyes"></button>
        </div>

        <div id="count-row">
          <h2 data-i18n="count"></h2>
          <div class="seg" role="radiogroup" data-setting="count">
            <button type="button" role="radio" data-value="1">1</button>
            <button type="button" role="radio" data-value="2">2</button>
            <button type="button" role="radio" data-value="3">3</button>
          </div>
        </div>

        <h2 data-i18n="time"></h2>
        <div class="seg" role="radiogroup" data-setting="time">
          <button type="button" role="radio" data-value="0" data-i18n="noTime"></button>
          <button type="button" role="radio" data-value="15" data-secs="15"></button>
          <button type="button" role="radio" data-value="30" data-secs="30"></button>
          <button type="button" role="radio" data-value="60" data-secs="60"></button>
        </div>

        <h2 data-i18n="player"></h2>
        <div class="seg" role="radiogroup" data-setting="player">
          <button type="button" role="radio" data-value="youtube">▶ YouTube</button>
          <button type="button" role="radio" data-value="spotify">● Spotify</button>
        </div>
        <p class="hint" id="player-desc"></p>
      </div>

      <p id="start-error" class="error" role="alert" hidden></p>
      <button id="start-btn" class="btn btn-primary btn-big" data-i18n="start"></button>

      <details class="rules">
        <summary data-i18n="rulesTitle"></summary>
        <ol id="rules-list"></ol>
      </details>
    </section>

    <!-- JÁTÉK / GAME -->
    <section id="screen-game" class="screen" aria-live="polite">
      <div class="topbar">
        <button id="quit-btn" class="btn btn-link" type="button" data-i18n="quit"></button>
        <span id="round-label" class="muted"></span>
      </div>

      <div id="turn" class="turn"></div>

      <div id="card" class="card">
        <div id="words" class="words"></div>
        <div id="timer" class="timer" hidden>
          <div class="timer-bar"><div id="timer-fill"></div></div>
          <span id="timer-text"></span>
        </div>
      </div>

      <div id="actions" class="actions"></div>

      <div class="secondary">
        <button id="reroll-btn" type="button" class="btn btn-ghost" data-i18n="reroll"></button>
        <button id="hint-btn" type="button" class="btn btn-ghost" data-i18n="hint"></button>
        <button id="reveal-btn" type="button" class="btn btn-ghost" data-i18n="reveal"></button>
      </div>
      <div id="hint-box" class="hint-box" hidden></div>
      <div id="reveal" class="reveal" hidden></div>

      <ol id="scoreboard" class="scoreboard"></ol>
    </section>

    <!-- EREDMÉNY / RESULTS -->
    <section id="screen-results" class="screen">
      <header class="hero">
        <h1><span data-i18n="over"></span><span class="accent">!</span></h1>
        <p id="winner" class="tagline"></p>
      </header>
      <ol id="final-board" class="scoreboard final"></ol>
      <button id="again-btn" class="btn btn-primary btn-big" data-i18n="again"></button>
    </section>

  </main>

  <script src="js/i18n.js"></script>
  <script src="js/match.js"></script>
  <script src="js/player.js"></script>
  <script src="js/data-hu.js"></script>
  <script src="js/data-en.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
